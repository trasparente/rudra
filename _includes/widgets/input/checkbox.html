{% assign opt = include.options %}{% assign desc = opt.descriptions %}<div class='checkbox-container'>
{% assign list = opt.options | default: include.id %}
{% for option in list %}<input type='checkbox' id='{{ option }}' name='{{ option }}'{% if include.checked %} checked{% endif %}{% include widgets/input/attributes.html opt=opt attributes=site.fields.checkbox %}><label for='{{ option }}' itemscope><span itemprop='name'>{{ option }}</span>{% if desc[forloop.index0] %}<br><span itemprop='descriptions'>{{ desc[forloop.index0] | markdownify | replace: 'p>', 'span>' }}</span>{% endif %}</label>{% endfor %}</div>
