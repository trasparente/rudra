{% assign opt = include.options %}{% assign desc = opt.descriptions %}<div class='radio-container'>
{% for option in opt.options %}
<input type='radio' name='{{ include.id }}' id='{{ option }}' {% include widgets/input/attributes.html opt=opt attributes=site.fields.radio %}><label for='{{ option }}' itemscope><span itemprop='name'>{{ option }}</span>{% if desc[forloop.index0] %}<br><span itemprop='descriptions'>{{ desc[forloop.index0] | markdownify | replace: 'p>', 'span>' }}</span>{% endif %}</label>{% endfor %}</div>
