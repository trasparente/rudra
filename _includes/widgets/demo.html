<div style='color: var(--{{ include.color }})'>{{ include.color }} <span style='color: var(--{{ include.color }}-light)'>{{ include.color }}</span><span style='float: right' class='ff-monospace fg-dim'>{{ '1,2,3,4,5,6' | split: ',' | sample: 3 }}</span></div><div class='ff-micro uppercase' style='background: var(--{{ include.color }}-dark); border-top: 4px solid var(--{{ include.color }}); color: var(--{{ include.color }}-light); text-align:right'>{{ include.color }}</div>
