{% if include.color %}
<div style='color: var(--{{ include.color }})'>{{ include.color }} <span style='color: var(--{{ include.color }}-light)'>{{ include.color }}</span><span style='float: right' class='ff-monospace fg-dim'>{{ '1,2,3,4,5,6' | split: ',' | sample: 3 }}</span></div><div class='ff-micro uppercase' style='background: var(--{{ include.color }}-dark); border-top: 4px solid var(--{{ include.color }}); color: var(--{{ include.color }}-light); text-align:right'>{{ include.color }}</div>
{% elsif include.shade %}
<div class='bg-{{ include.shade }} flex uppercase'><span>{{ include.shade }}</span><span class='fg-black'>{{ include.shade }}</span></div>
{% elsif include.border %}
<div class='border bc-{{ include.border }} flex uppercase'><span>{{ include.border }}</span><span class='fg-{{ include.border }}'>{{ include.border }}</span></div>
{% endif %}
<style type="text/css">
{% capture style %}
.demo-shades, .demo-borders
  div
    border-radius: 8px
    margin-block: .2em
  span
    padding: .2em
{% endcapture %}
{{ style | sassify }}
</style>
